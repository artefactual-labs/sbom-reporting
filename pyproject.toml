[project]
name = "sbom-reporting"
version = "0.2.0"
description = "Validate, combine, and verify software inventories in Dependency-Track"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cyclonedx-python-lib[validation]>=11.12.0",
    "httpx>=0.28.1",
    "packageurl-python>=0.17.6",
    "pydantic>=2.14.2",
]

[project.scripts]
sbom-reporting = "sbom_reporting.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["sbom_reporting"]
branch = true

[tool.ty.environment]
python-version = "3.14"
